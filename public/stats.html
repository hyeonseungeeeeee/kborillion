<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>크보릴리온 통계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DotGothic16&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--night:#0a110d;--board:#0f2a1c;--edge:#1e4a32;--chalk:#f4f1e6;--dim:#9db3a5;--led:#ffc24a;--grass:#2f7d46;--line:rgba(244,241,230,.16);
  --display:"Black Han Sans","IBM Plex Sans KR",sans-serif;--body:"IBM Plex Sans KR",system-ui,sans-serif;--dot:"DotGothic16",ui-monospace,monospace;color-scheme:dark}
body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--body);font-size:15px;padding:20px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0}
h1 span{color:var(--led)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tile{background:var(--board);border:2px solid var(--edge);border-radius:6px;padding:10px 12px}
.tile small{display:block;color:var(--dim);font-size:.75rem}
.tile b{font-family:var(--dot);font-weight:400;font-size:1.6rem;color:var(--led)}
.chart{background:var(--board);border:2px solid var(--edge);border-radius:6px;padding:12px;overflow-x:auto}
.chart svg{display:block;min-width:600px;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--dim);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:400}
.note{color:var(--dim);font-size:.8rem;margin:0}
a{color:var(--led)}
</style>
</head>
<body>
<div class="wrap">
  <h1>크보릴리온 <span>통계</span></h1>
  <div class="tiles">
    <div class="tile"><small>오늘 방문</small><b id="tv">–</b></div>
    <div class="tile"><small>오늘 방문자 (브라우저 기준)</small><b id="tu">–</b></div>
    <div class="tile"><small>오늘 플레이</small><b id="tp">–</b></div>
    <div class="tile"><small>누적 방문 / 플레이</small><b id="tt">–</b></div>
  </div>
  <div class="chart">
    <div class="legend"><span><i style="background:var(--grass)"></i>방문</span><span><i style="background:var(--led)"></i>플레이</span></div>
    <svg id="svg" viewBox="0 0 600 180" role="img" aria-label="최근 30일 방문과 플레이"></svg>
  </div>
  <table><thead><tr><th>날짜</th><th>방문</th><th>방문자</th><th>플레이</th></tr></thead><tbody id="rows"></tbody></table>
  <p class="note">한국 시간 기준 최근 30일. 방문자는 브라우저마다 따로 세서, 한 사람이 휴대폰과 컴퓨터로 들어오면 2명이에요. <a href="/">게임으로 돌아가기</a></p>
</div>
<script>
const $=id=>document.getElementById(id);
fetch("/api/stats").then(r=>r.json()).then(({days,total})=>{
  const t=days[days.length-1];
  $("tv").textContent=t.views.toLocaleString();$("tu").textContent=t.visitors.toLocaleString();$("tp").textContent=t.plays.toLocaleString();
  $("tt").textContent=total.views.toLocaleString()+" / "+total.plays.toLocaleString();
  const max=Math.max(1,...days.map(d=>Math.max(d.views,d.plays))),W=600,H=180,L=34,B=22,bw=(W-L)/days.length;
  const y=v=>H-B-(H-B-10)*v/max;let s="";
  for(const f of [0,.5,1]){const v=Math.round(max*f);s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(244,241,230,.12)"/><text x="${L-4}" y="${y(v)+4}" fill="#9db3a5" font-size="10" text-anchor="end">${v}</text>`;}
  days.forEach((d,i)=>{const x=L+i*bw;
    s+=`<rect x="${x+1}" y="${y(d.views)}" width="${bw/2-1}" height="${H-B-y(d.views)}" fill="#2f7d46"><title>${d.date} 방문 ${d.views}</title></rect>`;
    s+=`<rect x="${x+bw/2}" y="${y(d.plays)}" width="${bw/2-1}" height="${H-B-y(d.plays)}" fill="#ffc24a"><title>${d.date} 플레이 ${d.plays}</title></rect>`;
    if(i%5===4)s+=`<text x="${x+bw/2}" y="${H-6}" fill="#9db3a5" font-size="10" text-anchor="middle">${d.date.slice(5)}</text>`;});
  $("svg").innerHTML=s;
  $("rows").innerHTML=days.slice().reverse().map(d=>`<tr><td>${d.date}</td><td>${d.views}</td><td>${d.visitors}</td><td>${d.plays}</td></tr>`).join("");
}).catch(()=>{$("rows").innerHTML='<tr><td colspan="4">통계를 불러오지 못했어요.</td></tr>';});
</script>
</body>
</html>
